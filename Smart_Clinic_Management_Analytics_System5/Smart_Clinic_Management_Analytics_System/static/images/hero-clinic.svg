<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 440" role="img" aria-label="Illustration of a modern clinic building with calendar, heartbeat and analytics cards">
  <defs>
    <linearGradient id="roof" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#1fb383"/>
      <stop offset="1" stop-color="#0e7a55"/>
    </linearGradient>
    <filter id="sh" x="-20%" y="-20%" width="140%" height="150%">
      <feDropShadow dx="0" dy="8" stdDeviation="10" flood-color="#0e7a55" flood-opacity=".18"/>
    </filter>
  </defs>
  <!-- background -->
  <circle cx="280" cy="220" r="205" fill="#DDF5E9"/>
  <circle cx="470" cy="80" r="46" fill="#ccefdd"/>
  <circle cx="80" cy="360" r="34" fill="#ccefdd"/>
  <!-- ground -->
  <ellipse cx="280" cy="385" rx="230" ry="22" fill="#bfe8d3"/>
  <!-- building -->
  <g filter="url(#sh)">
    <rect x="150" y="150" width="260" height="235" rx="14" fill="#fff"/>
    <rect x="130" y="128" width="300" height="42" rx="12" fill="url(#roof)"/>
  </g>
  <!-- sign cross -->
  <circle cx="280" cy="106" r="40" fill="#fff" filter="url(#sh)"/>
  <path d="M271 82h18v16h16v18h-16v16h-18v-16h-16V98h16z" transform="translate(0,-4) scale(1) translate(0,4)" fill="#15966A"/>
  <path d="M272 86h16v14h14v16h-14v14h-16v-14h-14v-16h14z" fill="#15966A" opacity="0"/>
  <!-- windows -->
  <g fill="#DDF5E9" stroke="#15966A" stroke-width="3">
    <rect x="175" y="195" width="56" height="50" rx="8"/>
    <rect x="329" y="195" width="56" height="50" rx="8"/>
    <rect x="175" y="280" width="56" height="50" rx="8"/>
    <rect x="329" y="280" width="56" height="50" rx="8"/>
  </g>
  <g stroke="#15966A" stroke-width="3" opacity=".6">
    <line x1="203" y1="195" x2="203" y2="245"/><line x1="175" y1="220" x2="231" y2="220"/>
    <line x1="357" y1="195" x2="357" y2="245"/><line x1="329" y1="220" x2="385" y2="220"/>
    <line x1="203" y1="280" x2="203" y2="330"/><line x1="175" y1="305" x2="231" y2="305"/>
    <line x1="357" y1="280" x2="357" y2="330"/><line x1="329" y1="305" x2="385" y2="305"/>
  </g>
  <!-- door -->
  <rect x="246" y="262" width="68" height="123" rx="10" fill="#15966A"/>
  <rect x="256" y="274" width="20" height="111" fill="#DDF5E9" opacity=".85"/>
  <rect x="284" y="274" width="20" height="111" fill="#DDF5E9" opacity=".85"/>
  <path d="M280 205h0" stroke="#15966A"/>
  <path d="M262 232h8l4-8 6 16 4-8h12" fill="none" stroke="#15966A" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round"/>
  <!-- plants -->
  <g>
    <rect x="108" y="350" width="26" height="35" rx="5" fill="#0e7a55"/>
    <path d="M121 350c-22-10-26-34-14-46 14 8 20 26 14 46z" fill="#1fb383"/>
    <path d="M121 350c18-12 24-32 14-46-14 10-18 28-14 46z" fill="#15966A"/>
    <rect x="428" y="350" width="26" height="35" rx="5" fill="#0e7a55"/>
    <path d="M441 350c-22-10-26-34-14-46 14 8 20 26 14 46z" fill="#1fb383"/>
    <path d="M441 350c18-12 24-32 14-46-14 10-18 28-14 46z" fill="#15966A"/>
  </g>
  <!-- floating card: calendar -->
  <g filter="url(#sh)">
    <rect x="30" y="170" width="112" height="96" rx="14" fill="#fff"/>
    <rect x="30" y="170" width="112" height="28" rx="14" fill="#15966A"/>
    <rect x="30" y="184" width="112" height="14" fill="#15966A"/>
  </g>
  <g fill="#DDF5E9">
    <rect x="44" y="208" width="18" height="14" rx="3"/><rect x="68" y="208" width="18" height="14" rx="3"/>
    <rect x="92" y="208" width="18" height="14" rx="3" fill="#15966A"/><rect x="116" y="208" width="14" height="14" rx="3"/>
    <rect x="44" y="230" width="18" height="14" rx="3"/><rect x="68" y="230" width="18" height="14" rx="3"/>
    <rect x="92" y="230" width="18" height="14" rx="3"/><rect x="116" y="230" width="14" height="14" rx="3"/>
  </g>
  <circle cx="54" cy="184" r="4" fill="#fff"/><circle cx="118" cy="184" r="4" fill="#fff"/>
  <!-- floating card: analytics -->
  <g filter="url(#sh)">
    <rect x="420" y="190" width="116" height="100" rx="14" fill="#fff"/>
  </g>
  <g fill="#15966A">
    <rect x="438" y="244" width="16" height="30" rx="4" opacity=".45"/>
    <rect x="462" y="226" width="16" height="48" rx="4" opacity=".7"/>
    <rect x="486" y="208" width="16" height="66" rx="4"/>
  </g>
  <path d="M436 232l26-16 22 8 36-22" fill="none" stroke="#24352F" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" opacity=".55"/>
  <!-- floating card: heartbeat -->
  <g filter="url(#sh)">
    <rect x="360" y="70" width="130" height="64" rx="14" fill="#fff"/>
  </g>
  <path d="M376 104h18l7-16 12 30 9-18 6 4h44" fill="none" stroke="#15966A" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" transform="scale(.8) translate(94 26)"/>
  <!-- stethoscope -->
  <g fill="none" stroke="#24352F" stroke-width="5" stroke-linecap="round">
    <path d="M70 70v28a22 22 0 0 0 44 0V70" opacity="0"/>
  </g>
  <g transform="translate(46 56)" fill="none" stroke="#0e7a55" stroke-width="5" stroke-linecap="round" stroke-linejoin="round">
    <path d="M10 0v26a18 18 0 0 0 36 0V0"/>
    <path d="M28 44v14a16 16 0 0 0 32 0V50"/>
  </g>
  <circle cx="106" cy="104" r="9" fill="#fff" stroke="#0e7a55" stroke-width="5"/>
  <circle cx="56" cy="54" r="5" fill="#0e7a55"/><circle cx="92" cy="54" r="5" fill="#0e7a55"/>
</svg>
