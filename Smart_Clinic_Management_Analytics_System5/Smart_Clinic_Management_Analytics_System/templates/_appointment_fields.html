<div class="form-grid cols-2">
  <div class="field span-2">
    <label for="patient_id">Patient</label>
    <select id="patient_id" name="patient_id" required>
      <option value="" disabled {{ 'selected' if not form.get('patient_id') }}>Select a patient…</option>
      {% for p in patients %}<option value="{{ p.patient_id }}" {{ 'selected' if form.get('patient_id') == p.patient_id }}>{{ p.full_name }} ({{ p.patient_id }})</option>{% endfor %}
    </select>
    <div class="hint">The patient name is filled in automatically.</div>
  </div>
  <div class="field">
    <label for="appointment_date">Date</label>
    <input id="appointment_date" name="appointment_date" type="date" required value="{{ form.get('appointment_date', '') }}">
  </div>
  <div class="field">
    <label for="appointment_time">Time slot</label>
    <select id="appointment_time" name="appointment_time" required>
      {% for t in TIME_SLOTS %}<option value="{{ t }}" {{ 'selected' if form.get('appointment_time') == t }}>{{ t|time12 }}</option>{% endfor %}
    </select>
  </div>
  <div class="field span-2">
    <label for="doctor_name">Doctor</label>
    <select id="doctor_name" name="doctor_name" required>
      <option value="" disabled {{ 'selected' if not form.get('doctor_name') }}>Select a doctor…</option>
      {% for d in DOCTORS %}<option value="{{ d }}" {{ 'selected' if form.get('doctor_name') == d }}>{{ d }}</option>{% endfor %}
    </select>
  </div>
  <div class="field span-2">
    <label for="reason">Reason for visit</label>
    <input id="reason" name="reason" type="text" required minlength="3" maxlength="120" placeholder="e.g. Routine check-up" value="{{ form.get('reason', '') }}">
  </div>
  {% if editing %}
  <div class="field span-2">
    <label for="status">Appointment status</label>
    <select id="status" name="status" required>
      {% for s in STATUSES %}<option value="{{ s }}" {{ 'selected' if form.get('status') == s }}>{{ s }}</option>{% endfor %}
    </select>
  </div>
  {% endif %}
</div>
