<div class="form-grid cols-2">
  <div class="field">
    <label for="pid">Patient ID</label>
    <input id="pid" type="text" value="{{ pid or new_id }}" readonly aria-describedby="pid-hint">
    <div class="hint" id="pid-hint">Generated automatically.</div>
  </div>
  <div class="field">
    <label for="age">Age</label>
    <input id="age" name="age" type="number" min="0" max="120" step="1" required value="{{ form.get('age', '') }}">
  </div>
  <div class="field span-2">
    <label for="full_name">Full name</label>
    <input id="full_name" name="full_name" type="text" required minlength="2" maxlength="60" autocomplete="off" value="{{ form.get('full_name', '') }}">
  </div>
  <div class="field">
    <label for="contact">Contact number</label>
    <input id="contact" name="contact" type="tel" required inputmode="tel" pattern="\+?[0-9 \-]{10,16}" placeholder="9876543210" value="{{ form.get('contact', '') }}">
  </div>
  <div class="field">
    <label for="gender">Gender</label>
    <select id="gender" name="gender" required>
      <option value="" disabled {{ 'selected' if not form.get('gender') }}>Select…</option>
      {% for g in GENDERS %}<option value="{{ g }}" {{ 'selected' if form.get('gender') == g }}>{{ g }}</option>{% endfor %}
    </select>
  </div>
  <div class="field span-2">
    <label for="visit_date">Visit date</label>
    <input id="visit_date" name="visit_date" type="date" required max="{{ today }}" value="{{ form.get('visit_date', '') }}">
  </div>
</div>
