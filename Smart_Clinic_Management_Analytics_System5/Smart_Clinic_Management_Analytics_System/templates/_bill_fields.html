<div class="form-grid cols-2">
  <div class="field span-2">
    <label for="patient_id">Patient</label>
    <select id="patient_id" name="patient_id" required>
      <option value="" disabled {{ 'selected' if not form.get('patient_id') }}>Select a patient…</option>
      {% for p in patients %}<option value="{{ p.patient_id }}" {{ 'selected' if form.get('patient_id') == p.patient_id }}>{{ p.full_name }} ({{ p.patient_id }})</option>{% endfor %}
    </select>
  </div>
  <div class="field">
    <label for="consultation_fee">Consultation fee (₹)</label>
    <input id="consultation_fee" name="consultation_fee" type="number" min="0" max="100000" step="0.01" required value="{{ form.get('consultation_fee', '') }}">
  </div>
  <div class="field">
    <label for="additional_charges">Additional charges (₹)</label>
    <input id="additional_charges" name="additional_charges" type="number" min="0" max="100000" step="0.01" value="{{ form.get('additional_charges', '0') }}">
  </div>
  <div class="field span-2">
    <div class="total-preview">Total amount = consultation fee + additional charges.
      {% if form.get('total_amount') %}Current total: <strong>{{ form.get('total_amount')|money }}</strong>.{% else %}It is calculated automatically when you save.{% endif %}</div>
  </div>
  <div class="field">
    <label for="payment_method">Payment method</label>
    <select id="payment_method" name="payment_method" required>
      {% for m in PAY_METHODS %}<option value="{{ m }}" {{ 'selected' if form.get('payment_method') == m }}>{{ m }}</option>{% endfor %}
    </select>
  </div>
  <div class="field">
    <label for="payment_status">Payment status</label>
    <select id="payment_status" name="payment_status" required>
      {% for s in PAY_STATUSES %}<option value="{{ s }}" {{ 'selected' if form.get('payment_status') == s }}>{{ s }}</option>{% endfor %}
    </select>
  </div>
  <div class="field span-2">
    <label for="bill_date">Bill date</label>
    <input id="bill_date" name="bill_date" type="date" required max="{{ today }}" value="{{ form.get('bill_date', '') }}">
  </div>
</div>
