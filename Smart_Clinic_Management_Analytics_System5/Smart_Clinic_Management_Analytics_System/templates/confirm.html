{% extends "base.html" %}
{% block title %}{{ title }}{% endblock %}
{% block content %}
<div class="card" style="max-width:560px">
  <h2>{{ icon('trash', 20) }} {{ message }}</h2>
  <p class="muted">{{ note }}</p>
  <form method="post" class="actions">
    <input type="hidden" name="_csrf" value="{{ csrf_token }}">
    <button class="btn btn-solid-danger" type="submit">{{ icon('trash', 16) }} Yes, delete</button>
    <a class="btn btn-outline" href="{{ cancel_url }}">Keep it</a>
  </form>
</div>
{% endblock %}
